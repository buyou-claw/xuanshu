# 玄枢客户端插件的 bundle 补丁：把宿主半边的插件行插进 profile 名册。
#
# 形态照抄上游样板 @linxin666/dsh-client-ui-skill-explorer/cordis.patch.yml
# （bundle 层的 `insert` 写法），行 id / name 按票 01 契约第 0 节固定 = 包名，
# 二者必须在装配后的树 id 列表中出现（seam S1）。
#
# 宿主半边 lib/index.js 是最小 no-op cordis 插件，只为让这一行 id 进树；
# 浏览器半边 lib/client.js 是同一行在 web 平台的补充（dsh.client.platform=web）。
- insert:
    - id: xuanshu-client
      name: 'xuanshu-client'
